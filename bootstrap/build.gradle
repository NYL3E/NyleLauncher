plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'fr.nylerp.bootstrap'
// La version du bootstrap DOIT égaler le tag de release (vX.Y.Z), sinon SelfUpdater boucle :
// le bootstrap installé se déclare < au dernier tag → « Mettre à jour » proposé à l'infini
// (incident 2026-07-10 : tag v0.3.22 mais build.gradle resté à 0.3.21). Le CI passe donc
// -PbootstrapVersion=<tag sans 'v'> ; le littéral ci-dessous n'est qu'un repli pour les builds
// locaux/IDE (sans le -P). Ne JAMAIS publier une release dont le tag ≠ cette version.
version = project.findProperty('bootstrapVersion') ?: "0.3.22"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Only Gson + slf4j-simple — keep deps minimal so the bootstrap stays small.
    implementation 'com.google.code.gson:gson:2.11.0'

    // Garde-fous du chemin de mise à jour DEV (voir DevUpdatePathTest). Portée test uniquement :
    // le jar publié reste aussi petit qu'avant.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

application {
    mainClass = 'fr.nylerp.bootstrap.Bootstrap'
}

shadowJar {
    archiveBaseName.set('nylelauncher-bootstrap')
    archiveClassifier.set('')
    archiveVersion.set(project.version)
    // Make the jar runnable
    manifest {
        attributes('Main-Class': 'fr.nylerp.bootstrap.Bootstrap')
    }
}

// Stamp the gradle version into a resource the bootstrap reads at runtime,
// so Bootstrap.VERSION cannot drift from the build's source of truth.
// NB: the task's output MUST be a directory (containing the .properties file),
// not a single file — sourceSets.resources.srcDir() expects a dir.
def writeBootstrapVersion = tasks.register('writeBootstrapVersion') {
    def outDir = layout.buildDirectory.dir('generated/version')
    outputs.dir(outDir)
    inputs.property('version', project.version)
    doLast {
        def f = outDir.get().file('bootstrap-version.properties').asFile
        f.parentFile.mkdirs()
        f.text = "version=${project.version}\n"
    }
}
sourceSets.main.resources.srcDir(writeBootstrapVersion)
processResources.dependsOn(writeBootstrapVersion)

// Canal du SOCLE (2026-08-08) : 'prod' par défaut, 'dev' avec -Pchannel=dev.
//   ./gradlew :bootstrap:shadowJar                   → socle PROD (manifeste du site, cache payload/)
//   ./gradlew :bootstrap:shadowJar -Pchannel=dev     → socle DEV  (manifeste dev-payload, cache payload-dev/)
// Écrit sur le même modèle que la version : une ressource générée, jamais une constante Java à
// maintenir à la main — c'est précisément la dérive qui avait mordu Bootstrap.VERSION.
def writeBootstrapChannel = tasks.register('writeBootstrapChannel') {
    def chan = (project.findProperty('channel') ?: 'prod').toString()
    def outDir = layout.buildDirectory.dir('generated/channel')
    outputs.dir(outDir)
    inputs.property('channel', chan)
    doLast {
        def f = outDir.get().file('bootstrap-channel.properties').asFile
        f.parentFile.mkdirs()
        f.text = "channel=${chan}\n"
    }
}
sourceSets.main.resources.srcDir(writeBootstrapChannel)
processResources.dependsOn(writeBootstrapChannel)

build.dependsOn shadowJar
