ShortDescription: Cross-platform launcher for the NyleRP French Minecraft roleplay server.
Description: |-
  NyleLauncher is the official open-source launcher for NyleRP, a French
  Minecraft roleplay server (play.nylerp.fr). It handles Microsoft account
  authentication via the official Xbox Live OAuth flow, auto-updates a
  curated modpack from a signed manifest at each launch, and starts the
  game directly into the server. Built around a small native bootstrap
  installer that fetches an updateable payload from GitHub Releases so the
  signed binary stays tiny and stable while features can ship without a
  re-install.
